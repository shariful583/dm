# SPDX-License-Identifier: GPL-3.0-or-later
#
# Windows installer: on a version tag (v0.1.0) or by hand. Signs only when
# the signing secrets exist; without them it produces an unsigned installer and
# still passes:
#   LANES_SIGN_PFX_BASE64  the code-signing certificate (.pfx), base64
#   LANES_SIGN_PASSWORD    its password
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    name: Windows installer
    runs-on: windows-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
      HAS_CERT: ${{ secrets.LANES_SIGN_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Read vcpkg baseline
        id: baseline
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          "commit=$baseline" >> $env:GITHUB_OUTPUT

      - name: Set up vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          git -C "$env:VCPKG_ROOT" checkout ${{ steps.baseline.outputs.commit }}
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-windows-release-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-windows-release-

      # Qt under the LGPL through aqtinstall. Qt 6.10.3, not the 6.12 used for
      # development: from 6.11 on, Qt's download server keeps one folder per compiler
      # (qt6_6120/qt6_6120_msvc2022_64/), which aqtinstall 3.3.0 (the newest) cannot read yet.
      # Move to 6.12 once a newer aqtinstall can. Lanes builds with Qt 6.8+.
      # Python 3.14 exactly: current Qt archives need its zipfile support (older Pythons fail with
      # BadZipFile), and 3.15 is too new for aqtinstall's dependencies. aqtinstall runs directly
      # (not through a wrapper action) so its own messages show in the log.
      - name: Set up Python for aqtinstall
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\Qt
          key: qt-6.10.3-win64_msvc2022_64-v1

      - name: Install Qt
        shell: pwsh
        run: |
          $qt = Join-Path $env:RUNNER_TEMP 'Qt'
          if (-not (Test-Path "$qt\6.10.3\msvc2022_64\bin\qmake.exe")) {
            python -m pip install --disable-pip-version-check "aqtinstall==3.3.*"
            if ($LASTEXITCODE -ne 0) { throw 'pip install aqtinstall failed' }
            python -m aqt install-qt windows desktop 6.10.3 win64_msvc2022_64 --outputdir $qt
            if ($LASTEXITCODE -ne 0) { throw 'aqt install-qt failed (see its messages above)' }
          }
          # CMakeLists.txt adds QT_ROOT_DIR to CMAKE_PREFIX_PATH.
          "QT_ROOT_DIR=$qt\6.10.3\msvc2022_64" >> $env:GITHUB_ENV
          "$qt\6.10.3\msvc2022_64\bin" >> $env:GITHUB_PATH

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Fetch third-party programs (pinned, SHA-256 checked)
        shell: pwsh
        run: ./tools/fetch-third-party.ps1

      - name: Prepare signing
        if: ${{ env.HAS_CERT == 'true' }}
        shell: pwsh
        env:
          PFX: ${{ secrets.LANES_SIGN_PFX_BASE64 }}
          PASSWORD: ${{ secrets.LANES_SIGN_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'lanes-sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX))
          "LANES_SIGN_ARGS=/fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f `"$pfx`" /p `"$env:PASSWORD`"" >> $env:GITHUB_ENV

      - name: Build the installer
        shell: pwsh
        run: ./tools/make-installer.ps1 -Iscc "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

      - name: Test the release build
        run: ctest --preset windows-release

      - name: Pack the browser extension
        shell: pwsh
        run: ./tools/make-extension.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: lanes-setup
          path: build/installer/*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: lanes-extension
          path: build/extension/*.zip
